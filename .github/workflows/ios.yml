name: iOS CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build and test Bloom on iPhone simulator
    runs-on: macos-latest

    env:
      SCHEME: Bloom
      PROJECT: Bloom.xcodeproj

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Pick an iPhone simulator
        run: |
          # xcrun xctrace lists devices on stderr (https://developer.apple.com/forums/thread/663959)
          device=$(xcrun xctrace list devices 2>&1 | grep -oE 'iPhone.*?[^\(]+' | head -1 | awk '{$1=$1;print}' | sed -e "s/ Simulator$//")
          if [ -z "$device" ]; then
            echo "No iPhone simulator found on this runner" >&2
            exit 1
          fi
          echo "Using simulator: $device"
          echo "DEVICE=$device" >> "$GITHUB_ENV"

      - name: Build
        run: |
          xcodebuild build-for-testing \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,name=$DEVICE"

      - name: Test
        run: |
          xcodebuild test-without-building \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,name=$DEVICE"
