name: iOS CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build and test Bloom on iPhone simulator
    runs-on: macos-26
    timeout-minutes: 30

    env:
      SCHEME: Bloom
      PROJECT: Bloom.xcodeproj

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Pick the newest iPhone simulator
        run: |
          cat > /tmp/pick_sim.py <<'PYEOF'
          import json, re, sys
          data = json.load(sys.stdin)["devices"]
          best = None
          for runtime, devs in data.items():
              m = re.search(r"iOS-(\d+)-(\d+)", runtime)
              if not m:
                  continue
              v = (int(m.group(1)), int(m.group(2)))
              for d in devs:
                  if d.get("isAvailable") and d["name"].startswith("iPhone"):
                      if best is None or v > best[0]:
                          best = (v, d)
          if best:
              print(best[1]["udid"], best[1]["name"], "%d.%d" % best[0])
          PYEOF
          PICK=$(xcrun simctl list devices available --json | python3 /tmp/pick_sim.py)
          if [ -z "$PICK" ]; then
            echo "No available iPhone simulator found on this runner" >&2
            exit 1
          fi
          echo "Picked simulator: $PICK"
          echo "DEVICE_ID=${PICK%% *}" >> "$GITHUB_ENV"

      - name: Build
        run: |
          xcodebuild build-for-testing \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,id=$DEVICE_ID"

      - name: Boot simulator and wait until ready
        run: xcrun simctl bootstatus "$DEVICE_ID" -b

      - name: Test
        run: |
          xcodebuild test-without-building \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -parallel-testing-enabled NO \
            -maximum-concurrent-test-simulator-destinations 1 \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 300 \
            -maximum-test-execution-time-allowance 600 \
            -resultBundlePath TestResults.xcresult

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
